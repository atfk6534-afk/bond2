name: Build BOND2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'bond2-project-fixed-final-v2.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found in the repository root."
            exit 1
          fi
          echo "Using project archive: $ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q -o "${{ steps.locate_zip.outputs.path }}" -d extracted

          if [ -f extracted/bond2/pubspec.yaml ]; then
            echo "PROJECT_DIR=extracted/bond2" >> "$GITHUB_ENV"
          elif [ -f extracted/pubspec.yaml ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          else
            PROJECT="$(find extracted -type f -name pubspec.yaml -print -quit)"
            if [ -z "$PROJECT" ]; then
              echo "ERROR: pubspec.yaml not found after extraction."
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0|ndk;26.1.10909125' || true

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Flutter tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
