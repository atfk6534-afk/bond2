name: Build BOND2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "ERROR: No project ZIP was found in the repository root."
            exit 1
          fi

          echo "Found project ZIP: ${ZIP_FILE}"
          echo "zip_file=${ZIP_FILE#./}" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "${{ steps.locate_zip.outputs.zip_file }}" -d extracted

          test -f extracted/bond2/pubspec.yaml

          echo "Project extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Verify Android configuration
        working-directory: extracted/bond2
        shell: bash
        run: |
          set -euo pipefail

          flutter doctor -v

          grep -nE 'compileSdk|targetSdk|ndkVersion' android/app/build.gradle

          grep -n 'com.android.application' android/settings.gradle

      - name: Install dependencies
        working-directory: extracted/bond2
        run: flutter pub get

      - name: Generate Drift code
        working-directory: extracted/bond2
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: extracted/bond2
        run: flutter analyze

      - name: Flutter tests
        working-directory: extracted/bond2
        run: flutter test

      - name: Build release APK
        working-directory: extracted/bond2
        run: flutter build apk --release

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="extracted/bond2/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: extracted/bond2/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
