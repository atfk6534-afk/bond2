name: Build BOND2 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP"
          unzip -o "$ZIP"

          if [ ! -f "bond2/pubspec.yaml" ]; then
            echo "ERROR: bond2/pubspec.yaml was not found after extraction."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "BOND2 project extracted successfully."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: bond2
        run: flutter pub get

      - name: Generate Drift code
        working-directory: bond2
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: bond2
        run: flutter analyze

      - name: Test
        working-directory: bond2
        run: flutter test

      - name: Build APK
        working-directory: bond2
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: bond2/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
