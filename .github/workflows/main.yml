name: Build BOND2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f \
            \( -name 'bond2-project-fixed-final.zip' \
            -o -name 'bond2-project-final.zip' \
            -o -name '*.zip' \) \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Found project ZIP: $ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "${{ steps.locate_zip.outputs.path }}" -d extracted

          if [ -f extracted/bond2/pubspec.yaml ]; then
            echo "PROJECT_DIR=extracted/bond2" >> "$GITHUB_ENV"

          elif [ -f extracted/pubspec.yaml ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"

          else
            PROJECT="$(find extracted -name pubspec.yaml -type f -print -quit)"

            if [ -z "$PROJECT" ]; then
              echo "ERROR: pubspec.yaml not found after extraction."
              exit 1
            fi

            echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          fi

          echo "Project directory detected."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== compileSdk ==="
          grep -R "compileSdk" -n android || true

          echo "=== targetSdk ==="
          grep -R "targetSdk" -n android || true

          echo "=== ndkVersion ==="
          grep -R "ndkVersion" -n android || true

          echo "=== Gradle ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "=== Android plugins ==="
          grep -n "com.android.application" android/settings.gradle || true

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Generate Drift code
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Flutter tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Install dependencies after clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Regenerate Drift code
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
