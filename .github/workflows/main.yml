name: Build BOND2 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Find and extract the project ZIP
      - name: Extract BOND2 project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'bond2-project-final.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: bond2-project-final.zip was not found."
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -o "$ZIP_FILE"

          if [ ! -f "bond2/pubspec.yaml" ]; then
            echo "ERROR: bond2/pubspec.yaml was not found after extraction."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Flutter 3.24.5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 5. Dependencies
      - name: Install dependencies
        working-directory: bond2
        run: flutter pub get

      # 6. Generate Drift files
      - name: Generate Drift code
        working-directory: bond2
        run: |
          dart run build_runner build --delete-conflicting-outputs

      # 7. Analyze
      # Infos/lints should not block the APK build.
      # Real Dart errors still fail the workflow.
      - name: Flutter analyze
        working-directory: bond2
        run: |
          flutter analyze --no-fatal-infos

      # 8. Run all tests
      - name: Flutter tests
        working-directory: bond2
        run: |
          flutter test --reporter expanded

      # 9. Build release APK
      - name: Build release APK
        working-directory: bond2
        run: |
          flutter clean
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release

      # 10. Upload APK
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: bond2/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
