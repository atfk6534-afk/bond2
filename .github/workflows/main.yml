name: Build BOND2 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o bond2-project.zip
          test -d bond2
          echo "Project extracted successfully"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: bond2
        run: flutter pub get

      - name: Generate Drift database code
        working-directory: bond2
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter analyze
        working-directory: bond2
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: bond2
        run: flutter test

      - name: Build release APK
        working-directory: bond2
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: bond2/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
